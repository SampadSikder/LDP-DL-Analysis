# WSP sweep: which units get Stage-2 runs. Modes: wsp (LLM), finetune and random (baselines, no tokens).
modes: [wsp, finetune, random]

mv:
  config: configs/wsp/stage1_mv.yaml
  stage1_root: results/mean_variance_wsp/stage1      # --results-root of Stage 1 (experiment folder inside)
  out: results/mean_variance_wsp
  methods: [ft_removal, deepsets_recovery, settransformer_recovery]
  tier_a:                                             # main grid, budget 25
    protocols: [PM, SR]
    epsilon: [1.0, 4.0, 6.0]
    train_sources: [taxi]
    seeds: [0, 1, 2]
    budgets: [25]
  budget_curve:                                       # extra budgets on one cell
    protocols: [PM]
    epsilon: [4.0]
    train_sources: [taxi]
    seeds: [0, 1, 2]
    budgets: [10, 50]
  tier_b:                                             # later week, after pilot calibration
    protocols: [PM, SR]
    epsilon: [1.0, 4.0, 6.0]
    train_sources: [income, retirement]
    seeds: [0, 1, 2]
    budgets: [25]

freq:
  root: oat_b015_mga-a_n500k_v3f                      # results/<root>: existing Stage-1 runs (seed 42)
  data: output/oat_b015_mga-a_n500k                   # <data>/<PROTOCOL>: datasets used by those runs
  datasets: [zipf, emoji, fire]
  out_root: oat_b015_mga-a_n500k_v3f_wsp              # results/<out_root>: everything WSP writes
  reuse_seed: 42                                      # this seed's Stage 1 = the existing run folder
  seeds: [42, 43, 44]
  budgets: [25]
  runs: [cross/OUE_Zipf_test, cross/OUE_Emoji_test, cross/OUE_Fire_test, in_dist/Fire_OUE,
         cross/OLH_Server_Fire_test]
  # main.py arguments of the original runs (scripts/run_extra_eps.sh FT array + --feature-set v3), minus seed
  main_args: [-m, ft_transformer, --train-samples, '500000', --test-samples, '60000', --val-size, '0.10',
              --balanced-batches, --k-folds, '0', --epochs, '50', --patience, '10', --batch-size, '256',
              --lr, '0.0005', --d-token, '64', --n-heads, '8', --n-layers, '3', --ffn-d-multiplier, '1.33',
              --attention-dropout, '0.1', --residual-dropout, '0.0', --no-plot, --save-predictions,
              --feature-set, v3]
  spec: {train_samples: 500000, test_samples: 60000, val_size: 0.10, feature_set: v3, d_token: 64, n_heads: 8,
         n_layers: 3, ffn_d_multiplier: 1.33, attention_dropout: 0.1, residual_dropout: 0.0, lr: 0.0005,
         batch_size: 256}

pilot:                                                # run first; sweep waits for your go
  - mv/wsp_b10/single-source__PM_eps4__taxi__deepsets_recovery__s0
  - freq/wsp_b25/cross__OUE_Fire_test__s42
