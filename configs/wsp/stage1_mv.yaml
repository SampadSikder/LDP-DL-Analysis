# WSP Stage 1, mean/variance: gradient training, up to 50 epochs, with the existing code (run.py evaluate).
# Same experiment name and grid as breadth, so the round ids match breadth's generated rounds: the server script
# links results/mean_variance_wsp/stage1/breadth/rounds -> results/mean_variance_server/breadth/rounds (read-only).
# eps limited to the Stage-2 cells; all sources kept so within / cross / multi-source results come for free.
# `extends` replaces whole top-level keys, so classifier / neural repeat every breadth value.
extends: ../mean_variance/breadth.yaml
epsilon: [1.0, 4.0, 6.0]
methods: [ft_removal, deepsets_recovery, settransformer_recovery]
classifier: {epochs: 50, reports_per_round: 512, patience: 5}
neural: {epochs: 50, token_cap: 1024, patience: 6}
