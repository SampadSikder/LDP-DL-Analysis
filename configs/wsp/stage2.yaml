# WSP Stage 2 settings (LLM weight editing and the two baselines). Token caps per run depend on the probe
# budget; the global cap (WSP_TOKEN_CAP in .env, default below) is checked against the shared ledger before
# every LLM call and before every run starts.
budgets:                       # probe budget -> per-run limits
  10: {probes: 10, gate_evals: 6, token_cap: 3000000}
  25: {probes: 25, gate_evals: 10, token_cap: 6000000}
  50: {probes: 50, gate_evals: 16, token_cap: 10000000}
global_token_cap: 633000000    # 50% of the weekly quota minus the 9% already used this week
stop_launch_at: 0.90           # sweep stops starting new LLM runs at this share of the global cap
max_llm_calls: 200
wall_clock_min: 360
stop_after_rejects: 6
gate:
  max_changed_frac: 0.05       # of all weights, per edit
  max_rel_l2: 0.10             # ||W_new - W|| / ||W||, per edit
  bootstrap: 1000
  confidence: 0.90             # one-sided
  guard_tol: 0.02              # relative worsening allowed on guard metrics
  seed: 0
probe:
  rounds: 128                  # mean/variance: training rounds per probe (fixed subset, stratified)
  rows: 20000                  # frequency oracle: training rows per probe
  seed: 0
sandbox:
  timeout_s: 60
  mem_gb: 8
  threads: 2
agent:
  keep_turns: 8
  compact_at_tokens: 120000
  max_request_tokens: 200000
  tool_output_chars: 8000
  max_llm_calls: 200
finetune:
  epochs_per_gate: 1           # gradient epochs between gate evaluations
  lr_scale: 0.1                # fine-tune lr = Stage-1 lr x this
random:
  sigmas: [0.02, 0.05, 0.1, 0.2]   # noise std as a multiple of the tensor's std
