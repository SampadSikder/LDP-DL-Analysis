# Smoke run: every component end to end on a small slice. Not a benchmark result.
experiment: smoke
protocols: [SR, PM]
sources: [taxi, income, retirement]
epsilon: [1.0]
beta: [0.0, 0.1, 0.4]
attacks: [IPA, OPA]
targets: [m1v1, m3v3, m2v2]
rounds: {train: 12, val: 4, test: 6}
sizes: [2048]
target_mode: offset
square_mode: normalized   # matches paper experiments (Table 3 S(2), Figs. 5-6); raw = Sec. 2.2.1 text
knowledge_regime: compromised
knowledge_h: 1000
n_e_rule: sig2
methods: [standard, constant, oracle_removal, kmeans, mlp_removal, ft_removal, catboost_recovery,
          deepsets_recovery, settransformer_recovery]
seeds: [0]
multi_source: true
kmeans_subsets: 1000          # smoke only; the benchmark uses 5,000 (paper Sec. 8.1)
classifier: {epochs: 4, reports_per_round: 256, patience: 2}
neural: {epochs: 4, token_cap: 512, patience: 2}
