# Breadth benchmark (brief Sec. 7). 4,860 attacked + 30 clean configurations before feasibility.
experiment: breadth
protocols: [SR, PM]
sources: [taxi, income, retirement]
epsilon: [0.1, 1.0, 2.0, 4.0, 6.0]          # Fig. 10 labelled points
beta: [0.0, 0.05, 0.10, 0.20, 0.25, 0.40, 0.50, 0.60, 0.75, 0.80]
attacks: [IPA, OPA]
# targets: all 9 combinations of each source's printed mean x variance triplets
rounds: {train: 20, val: 10, test: 100}
sizes: [2048, 4096, 8192]                   # cycled over replicates; total fixed per round
target_mode: offset
square_mode: normalized   # matches paper experiments (Table 3 S(2), Figs. 5-6); raw = Sec. 2.2.1 text
knowledge_regime: compromised
knowledge_h: 1000
n_e_rule: sig2
ipa_solver: closed_form
sum_rule: paper
pm_spread_ratios: [0.05, 0.10, 0.25, 0.50, 1.0]   # OPA-PM, cycled over replicates
methods: [standard, constant, oracle_removal, kmeans, mlp_removal, ft_removal, catboost_recovery,
          deepsets_recovery, settransformer_recovery]
seeds: [0, 1, 2]
multi_source: true
kmeans_subsets: 5000
classifier: {epochs: 30, reports_per_round: 512, patience: 5}
neural: {epochs: 40, token_cap: 1024, patience: 6}
