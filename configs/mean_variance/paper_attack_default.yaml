# Attack-implementation validation at paper scale (Sec. 7.2.2 defaults): full sources, eps = 1,
# beta = 0.1, Table 4 targets (absolute; the middle entries preserve the genuine moment),
# 100 repetitions, compromised-sample knowledge (h = 1,000), n_e rounded as in Table 4.
# Reports MSE to the attacker's target, which validates the attacks. Not a defense result.
# Retirement uses a substitute dataset, so its printed absolute targets do not apply
# (see deviations.md); it is excluded here.
experiment: paper_attack_default
protocols: [SR, PM]
sources: [taxi, income]
epsilon: [1.0]
beta: [0.1]
attacks: [IPA, OPA]
rounds: {all: 100}
sizes: [full]
size_mode: fixed_genuine
plain_populations: true
target_mode: absolute
square_mode: normalized   # matches paper experiments (Table 3 S(2), Figs. 5-6); raw = Sec. 2.2.1 text
knowledge_regime: compromised
knowledge_h: 1000
n_e_rule: sig2
pm_spread_ratio: 0.25
