name: attacker-detector
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - scikit-learn
  - scipy
  - matplotlib
  - seaborn
  - tqdm
  - pip
  - pip:
    - torch
    - torchvision
    - torchaudio
    - --extra-index-url https://download.pytorch.org/whl/cu130  # match your CUDA driver
    #- --extra-index-url https://download.pytorch.org/whl/cpu  # cpuonly # without gpu
    - xxhash
    - torch-geometric
